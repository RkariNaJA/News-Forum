<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Forum</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d1b18'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23fffdf8' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <meta name="referrer" content="no-referrer">
</head>
<body>
  <header class="masthead">
    <div class="masthead-top">
      <span id="today-date" class="dateline"></span>
      <div class="masthead-actions">
        <span id="updated" class="muted"></span>
        <button id="prices-btn" class="btn" type="button" aria-pressed="false" title="Live crypto prices">Crypto Prices</button>
        <button id="stocks-btn" class="btn" type="button" aria-pressed="false" title="Live tech stock prices">Stock Prices</button>
        <button id="refresh" class="btn" type="button" title="Fetch the latest news from every source">Refresh</button>
        <button id="theme" class="btn icon" type="button" title="Switch light / dark" aria-label="Switch light or dark theme">◐</button>
      </div>
    </div>
    <h1 class="title">News Forum</h1>
    <p class="tagline">International news from 24 sources, gathered for you each day.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-view="today">Today <span class="count"></span></button>
    <button role="tab" data-view="world">World <span class="count"></span></button>
    <button role="tab" data-view="business">Business <span class="count"></span></button>
    <button role="tab" data-view="markets">Crypto &amp; Investing <span class="count"></span></button>
    <button role="tab" data-view="asia">Asia <span class="count"></span></button>
    <button role="tab" data-view="tech">Tech &amp; Science <span class="count"></span></button>
    <button role="tab" data-view="saved">Saved <span class="count"></span></button>
  </nav>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search headlines…" maxlength="100" aria-label="Search headlines">
    <select id="source" aria-label="Filter by source"><option value="">All sources</option></select>
    <label class="check"><input id="hide-read" type="checkbox"> Hide read</label>
    <button id="read-all" class="btn ghost" type="button">Mark all as read</button>
  </div>

  <div id="feed-alert" class="alert" hidden></div>

  <main id="list" class="list" aria-live="polite"></main>
  <section id="prices" class="prices" hidden>
    <div id="prices-widget"></div>
    <p class="muted prices-note">Live prices from <a id="prices-source" href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>,
      <span id="prices-detail"></span></p>
  </section>
  <p id="empty" class="empty" hidden></p>

  <footer class="footer">
    <button id="show-status" class="linkish" type="button">Source status</button>
    <span class="muted">· Feeds are listed in <code>feeds.json</code></span>
  </footer>

  <dialog id="status-dialog">
    <h2>Source status</h2>
    <table id="status-table"><thead><tr><th>Source</th><th>Section</th><th>Last fetch</th><th>Items</th><th>State</th></tr></thead><tbody></tbody></table>
    <form method="dialog"><button class="btn">Close</button></form>
  </dialog>

  <dialog id="reader" class="reader" aria-labelledby="reader-title">
    <div class="reader-bar">
      <span id="reader-meta" class="meta"></span>
      <div class="reader-tools">
        <label class="check" title="Highlight the most important sentences"><input id="reader-hl" type="checkbox" checked> Highlights</label>
        <button id="reader-close" class="btn icon" type="button" aria-label="Close">✕</button>
      </div>
    </div>
    <article class="reader-body">
      <h2 id="reader-title" class="reader-title"></h2>
      <p id="reader-byline" class="reader-byline"></p>
      <div id="reader-tags" class="reader-tags"></div>
      <img id="reader-image" class="reader-image" alt="" referrerpolicy="no-referrer" hidden>
      <div id="reader-notice" class="reader-notice" hidden></div>
      <div id="reader-text" class="reader-text"></div>
    </article>
    <div class="reader-actions">
      <a id="reader-open" class="btn primary" target="_blank" rel="noopener noreferrer">Read on site ↗</a>
      <button id="reader-save" class="btn" type="button">☆ Save</button>
    </div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
